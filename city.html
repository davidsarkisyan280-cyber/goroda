<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Города России — игра</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1b3b5c 0%, #2a5f8a 100%);
            padding: 16px;
        }

        .game-container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 42px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 2.3rem;
            letter-spacing: 2px;
            color: #fff6e0;
            text-shadow: 0 4px 12px #0d1f2e, 0 0 10px #b3e4ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 span {
            font-size: 2rem;
            filter: drop-shadow(0 0 6px #c1e4ff);
        }

        .subhead {
            text-align: center;
            color: #d9ecff;
            font-weight: 300;
            margin-bottom: 22px;
            font-size: 1.1rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 14px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #eef7ff;
            font-weight: 500;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .stat-item {
            background: rgba(10, 25, 40, 0.7);
            padding: 8px 18px;
            border-radius: 100px;
            border: 1px solid #a8d0ff;
            box-shadow: inset 0 1px 4px #577ea3, 0 5px 8px rgba(0, 0, 0, 0.3);
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item i {
            font-style: normal;
            font-size: 1.3rem;
        }

        .city-vector {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 16px 20px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 14px -8px black;
        }

        .city-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .city-icon {
            background: #ffde59;
            color: #1f3a4b;
            font-size: 2rem;
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #b08d2b, 0 8px 12px #00000055;
        }

        .city-name-big {
            font-size: 1.9rem;
            font-weight: 700;
            color: #fff6d5;
            text-shadow: 0 2px 0 #3a6a8a, 0 4px 12px black;
            line-height: 1.2;
            word-break: break-word;
        }

        .letter-hint {
            background: #f7e9b0;
            color: #1e3d52;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #8b7a4a, 0 4px 12px #00000044;
            border: 1px solid #fff3cc;
        }

        .letter-hint span {
            color: #b13e3e;
            font-size: 1.8rem;
            margin-left: 6px;
            text-transform: uppercase;
        }

        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 10px;
        }

        .input-area input {
            flex: 2;
            min-width: 200px;
            padding: 16px 20px;
            font-size: 1.3rem;
            border-radius: 60px;
            border: none;
            outline: 2px solid transparent;
            background: #ecf5ff;
            color: #122b3a;
            font-weight: 500;
            box-shadow: inset 0 6px 10px #a0b8cc, 0 4px 0 #244b66, 0 8px 16px #00000033;
            transition: 0.1s;
            font-family: inherit;
        }

        .input-area input:focus {
            outline: 3px solid #f5d742;
            background: #ffffff;
            box-shadow: inset 0 4px 8px #b0c7db, 0 4px 0 #1e3d55, 0 8px 20px #00000055;
        }

        .input-area button {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.3rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            background: #f5c542;
            color: #1e3d52;
            box-shadow: 0 7px 0 #b37e1e, 0 10px 18px black;
            cursor: pointer;
            transition: 0.1s ease;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .input-area button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #b37e1e, 0 8px 14px black;
        }

        .input-area button:disabled {
            opacity: 0.45;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #7a5a1a, 0 6px 10px black;
            pointer-events: none;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 50px;
            padding: 14px 22px;
            margin: 12px 0 8px;
            font-size: 1.2rem;
            text-align: center;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fffbee;
            border-left: 8px solid #f5c542;
            box-shadow: inset 0 2px 8px #00000055, 0 4px 12px black;
            font-weight: 500;
            transition: 0.15s;
            word-break: break-word;
        }

        .used-cities {
            margin-top: 22px;
            background: rgba(10, 20, 30, 0.6);
            border-radius: 32px;
            padding: 14px 16px;
            border: 1px solid #8bb3d1;
            box-shadow: inset 0 0 10px #00000033;
        }

        .used-cities h3 {
            color: #bedcff;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .city-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            max-height: 100px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-width: thin;
            scrollbar-color: #f5c542 #1e3d55;
        }

        .city-list::-webkit-scrollbar {
            width: 6px;
        }

        .city-list::-webkit-scrollbar-track {
            background: #1e3d55;
            border-radius: 10px;
        }

        .city-list::-webkit-scrollbar-thumb {
            background: #f5c542;
            border-radius: 10px;
        }

        .city-tag {
            background: #214f6e;
            color: #f0f9ff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid #b6d6f0;
            box-shadow: 0 2px 0 #0c2536, 0 4px 8px black;
            transition: 0.1s;
            white-space: nowrap;
        }

        .restart-btn {
            background: transparent;
            border: 2px solid #f5c542;
            color: #f5e6b0;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 0 #7a5a1a;
        }

        .restart-btn:hover {
            background: #f5c542;
            color: #1e3d52;
            box-shadow: 0 6px 0 #a5771b, 0 8px 16px black;
            transform: translateY(-2px);
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a5a1a;
        }

        .hint-small {
            font-size: 0.9rem;
            text-align: center;
            color: #aac9e2;
            margin-top: 6px;
        }

        .error {
            border-left-color: #ff6b6b !important;
            background: rgba(100, 20, 20, 0.7);
        }

        .success {
            border-left-color: #7ae07a !important;
            background: rgba(20, 80, 30, 0.7);
        }

        @media (max-width: 550px) {
            .game-container {
                padding: 20px 14px 26px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .city-name-big {
                font-size: 1.5rem;
            }
            .stat-item {
                padding: 6px 12px;
                font-size: 1rem;
            }
            .input-area input,
            .input-area button {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
            .letter-hint {
                font-size: 1.1rem;
                padding: 6px 14px;
            }
        }
    </style>
</head>

        // Объединяем и удаляем дубликаты (оставляем уникальные города)
        const ALL_CITIES = [...new Set([...RUSSIAN_CITIES, ...EXTRA_RU_CITIES])];

        const citySet = new Set(ALL_CITIES.map(city => city.toLowerCase()));

        let currentCity = 'Москва';          // стартовый город
        let requiredLetter = 'М';            // буква, на которую нужен город (последняя буква предыдущего)
        let usedCities = new Set(['москва']); // для быстрой проверки повторов (в нижнем регистре)

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function getLastLetter(city) {
            // берём последнюю букву, игнорируя пробелы, дефисы и прочее (но в городах обычно буквы)
            // Также приводим к нижнему регистру, ё считаем как е? По правилам обычно ё=е, но оставим как есть.
            let cleaned = city.trim().toLowerCase();
            // убираем все не-буквы (пробелы, дефисы)
            cleaned = cleaned.replace(/[^а-яё]/g, '');
            if (cleaned.length === 0) return '';
            return cleaned.slice(-1);
        }

        // Обновить отображение счёта, ходов и списка городов
        function updateUI() {
            scoreDisplay.textContent = score;
            movesDisplay.textContent = moves;
            currentCityNameEl.textContent = currentCity;
            requiredLetterEl.textContent = requiredLetter.toUpperCase();

            // Перерисовать список использованных городов
            cityListContainer.innerHTML = '';
            // Восстанавливаем изначальный порядок не важен, просто выводим все города из Set
            // Но для красоты добавим города в порядке добавления (у нас Set не хранит порядок, но можно создать массив)
            // Проще: пройти по ALL_CITIES и вывести те, что есть в usedCities? Но могут быть города не из словаря?
            // Показываем все, что были использованы, в алфавитном порядке для удобства.
            const usedArray = Array.from(usedCities).map(c => c.charAt(0).toUpperCase() + c.slice(1)).sort();
            usedArray.forEach(cityName => {
                const span = document.createElement('span');
                span.className = 'city-tag';
                span.textContent = cityName;
                cityListContainer.appendChild(span);
            });
        }

        // Показать сообщение с опциональным стилем
        function setMessage(text, type = '') {
            messageBox.textContent = text;
            messageBox.classList.remove('error', 'success');
            if (type === 'error') messageBox.classList.add('error');
            if (type === 'success') messageBox.classList.add('success');
        }

        // Сброс игры

            currentCity = 'Москва';
            requiredLetter = getLastLetter(currentCity);
            usedCities = new Set(['москва']);

            moves = 0;

            cityInput.focus();

            const rawInput = cityInput.value.trim();
            if (rawInput === '') {
                setMessage('Пожалуйста, введите название города.', 'error');
                cityInput.focus();
                return;
            }

            // Приводим ввод к нормальному виду (первая буква заглавная, остальные как ввели)
            // Но для проверки используем нижний регистр.
            const normalizedInput = rawInput.charAt(0).toUpperCase() + rawInput.slice(1).toLowerCase();
            const lowerInput = normalizedInput.toLowerCase();

            // 1. Проверка: город есть в списке разрешённых (только Россия)
            if (!citySet.has(lowerInput)) {
                setMessage(`❌ Город «${normalizedInput}» не найден в списке российских городов (или не является городом РФ). Попробуйте другой.`, 'error');
                cityInput.value = '';
                cityInput.focus();
                return;
            }

            // 2. Проверка: город уже использовался
            if (usedCities.has(lowerInput)) {
                setMessage(`⛔ Город «${normalizedInput}» уже был. Введите другой город.`, 'error');
                cityInput.value = '';
                cityInput.focus();
                return;
            }

            // 3. Проверка: первая буква должна совпадать с requiredLetter (без учёта регистра, ё/е)
            const firstLetter = lowerInput.charAt(0);
            // Обработка ё и е как эквивалентных (часто в городах ё заменяют на е, например "Королёв" и "Королев")
            const firstLetterNormalized = (firstLetter === 'ё') ? 'е' : firstLetter;
            const requiredNormalized = (requiredLetter === 'ё') ? 'е' : requiredLetter;

            if (firstLetterNormalized !== requiredNormalized) {
                setMessage(`🔤 Город должен начинаться на букву «${requiredLetter.toUpperCase()}». Вы ввели «${normalizedInput}».`, 'error');
                cityInput.value = '';
                cityInput.focus();
                return;
            }

            // Всё ок — принимаем город
            // Определяем последнюю букву для следующего хода
            let lastLetter = getLastLetter(normalizedInput);
            // Если последняя буква ь, ъ, ы — по правилам игры нужно выбрать другую (обычно пропускают или берут предпоследнюю)
            // В классических городах: если последняя буква "ь" или "ъ" или "ы", то следующая буква — предпоследняя.
            // Реализуем это правило для удобства.
            if (lastLetter === 'ь' || lastLetter === 'ъ' || lastLetter === 'ы') {
                // берём предпоследнюю букву, если она есть
                const cleaned = normalizedInput.toLowerCase().replace(/[^а-яё]/g, '');
                if (cleaned.length >= 2) {
                    lastLetter = cleaned[cleaned.length - 2];
                } else {
                    // если одна буква (маловероятно), оставляем как есть
                    lastLetter = cleaned[0] || 'а';
                }
            }

            // Обновляем состояние
            usedCities.add(lowerInput);
            currentCity = normalizedInput;
            requiredLetter = lastLetter;
            score += 10;          // +10 очков за город
            moves += 1;

            setMessage(`✅ Отлично! «${normalizedInput}» принят. Следующий город на букву «${requiredLetter.toUpperCase()}».`, 'success');
            cityInput.value = '';
            updateUI();
            cityInput.focus();

            // Проверка на конец игры: если больше нет доступных городов на требуемую букву? 
            // (необязательно, но можно проверить)
            // Но оставим игроку возможность искать, не будем автоматически завершать.
        }

        // ----- ОБРАБОТЧИКИ СОБЫТИЙ -----
        submitBtn.addEventListener('click', handleSubmit);

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSubmit();
            }
        });

        restartBtn.addEventListener('click', () => {
            resetGame();
        });

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            resetGame();
            // Фокус на поле ввода
            cityInput.focus();
        });

        // Начальная инициализация (на случай если load уже прошёл)
        updateUI();
        setMessage(`Введите город на букву «${requiredLetter.toUpperCase()}»`);

    })();
</script>
</body>
</html>
